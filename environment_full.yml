# ============================================
# EXCLUDED PACKAGES - MANUAL INSTALLATION REQUIRED
# ============================================
#
# Local Editable Installs:
# -------------------------
# These packages are installed in development/editable mode and must be installed
# manually after creating the conda environment:
#
#   eureka==1.0 (from /home/avidavid/Eureka)
#   isaacgym==1.0rc4 (from /home/avidavid/isaacgym/python)
#   isaacgymenvs==1.3.4 (from /home/avidavid/Eureka/isaacgymenvs)
#   rl_games==1.6.1 (from /home/avidavid/Eureka/rl_games)
#
# Installation commands:
#   cd /path/to/isaacgym/python && pip install -e .
#   cd /path/to/Eureka/isaacgymenvs && pip install -e .
#   cd /path/to/Eureka/rl_games && pip install -e .
#   cd /path/to/Eureka && pip install -e .
#
# ROS System Packages (install via apt):
# ---------------------------------------
# These are ROS (Robot Operating System) packages that should be installed
# via the system package manager (apt) or rosdep, not pip/conda:
#
#   actionlib, angles, bondpy, camera-calibration, camera-calibration-parsers,
#   catkin, controller-manager, controller-manager-msgs, cv-bridge,
#   diagnostic-analysis, diagnostic-common-diagnostics, diagnostic-updater,
#   dynamic-reconfigure, gazebo-model-attachment-plugin, gazebo-plugins,
#   gazebo-ros, gazebo-video-monitor-utils, gencpp, geneus, genlisp, genmsg,
#   gennodejs, genpy, image-geometry, interactive-markers, joint-state-publisher,
#   joint-state-publisher-gui, laser-geometry, mavros, message-filters,
#   python-qt-binding, qt-dotgraph, qt-gui, qt-gui-cpp, qt-gui-py-common,
#   resource-retriever, rosbag, rosboost-cfg, rosclean, roscreate, rosgraph,
#   roslaunch, roslib, roslint, roslz4, rosmake, rosmaster, rosmsg, rosnode,
#   rosparam, rospy, rosservice, rostest, rostopic, rosunit, roswtf,
#   rqt-action, rqt-bag, rqt-bag-plugins, rqt-console, rqt-dep, rqt-graph,
#   rqt-gui, rqt-gui-py, rqt-image-view, rqt-launch, rqt-logger-level,
#   rqt-moveit, rqt-msg, rqt-nav-view, rqt-plot, rqt-pose-view, rqt-publisher,
#   rqt-py-common, rqt-py-console, rqt-reconfigure, rqt-robot-dashboard,
#   rqt-robot-monitor, rqt-robot-steering, rqt-runtime-monitor, rqt-rviz,
#   rqt-service-caller, rqt-shell, rqt-srv, rqt-tf-tree, rqt-top, rqt-topic,
#   rqt-web, rviz, sensor-msgs, smach, smach-ros, smclib, tf, tf-conversions,
#   tf2-geometry-msgs, tf2-kdl, tf2-py, tf2-ros, topic-tools, unique-id, xacro
