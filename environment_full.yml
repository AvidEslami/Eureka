# Full Conda Environment Configuration
# Generated from installed packages in eureka/message.txt
# This file includes all conda-compatible packages with exact versions
#
# EXCLUDED PACKAGES (require manual installation):
# - eureka (local editable install from /home/avidavid/Eureka)
# - isaacgym (local editable install from /home/avidavid/isaacgym/python)
# - isaacgymenvs (local editable install from /home/avidavid/Eureka/isaacgymenvs)
# - rl_games (local editable install from /home/avidavid/Eureka/rl_games)
# - All ROS packages (system dependencies - install via apt/rosdep)
#
# To install editable packages after creating this environment:
#   pip install -e /path/to/isaacgym/python
#   pip install -e /path/to/Eureka/isaacgymenvs
#   pip install -e /path/to/Eureka/rl_games
#   pip install -e /path/to/Eureka

