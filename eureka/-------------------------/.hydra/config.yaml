task_name: ${task.name}
experiment: ''
env_path: ''
num_envs: ''
seed: 42
torch_deterministic: false
max_iterations: ''
physics_engine: physx
pipeline: gpu
sim_device: cuda:0
rl_device: cuda:0
graphics_device_id: 0
num_threads: 4
solver_type: 1
num_subscenes: 4
test: true
checkpoint: /home/gx22/Desktop/isaacgym/python/Eureka/eureka/outputs/eureka/2025-10-16_02-17-53/policy-2025-10-16_04-43-10/runs/ShadowHandDoorOpenInwardGPT-2025-10-16_04-43-10/nn/ShadowHandDoorOpenInwardGPT_successes_8552_0.01.pth
sigma: ''
multi_gpu: false
wandb_activate: false
wandb_group: ''
wandb_name: ${train.params.config.name}
wandb_entity: jma2020
wandb_project: isaac_gpt
wandb_tags: []
wandb_logcode_dir: ''
capture_video: true
capture_video_freq: 5000
capture_video_len: 200
force_render: true
headless: false
from_data: false
data_list: []
testing: false
task:
  name: ShadowHandDoorOpenInward
  physics_engine: ${..physics_engine}
  env:
    env_name: shadow_hand_door_open_inward
    numEnvs: ${resolve_default:2048,${...num_envs}}
    envSpacing: 1.5
    episodeLength: 250
    enableDebugVis: false
    cameraDebug: true
    pointCloudDebug: true
    aggregateMode: 1
    stiffnessScale: 1.0
    forceLimitScale: 1.0
    useRelativeControl: false
    dofSpeedScale: 20.0
    actionsMovingAverage: 1.0
    controlFrequencyInv: 1
    startPositionNoise: 0.0
    startRotationNoise: 0.0
    resetPositionNoise: 0.0
    resetRotationNoise: 0.0
    resetDofPosRandomInterval: 0.0
    resetDofVelRandomInterval: 0.0
    distRewardScale: 20
    transition_scale: 0.5
    orientation_scale: 0.5
    rotRewardScale: 1.0
    rotEps: 0.1
    actionPenaltyScale: -0.0002
    reachGoalBonus: 250
    fallDistance: 0.4
    fallPenalty: 0.0
    objectType: pot
    observationType: full_state
    handAgentIndex: '[[0, 1, 2, 3, 4, 5]]'
    asymmetric_observations: false
    successTolerance: 0.1
    printNumSuccesses: false
    maxConsecutiveSuccesses: 0
    asset:
      assetRoot: ../assets
      assetFileName: mjcf/open_ai_assets/hand/shadow_hand.xml
      assetFileNameBlock: urdf/objects/cube_multicolor.urdf
      assetFileNameEgg: mjcf/open_ai_assets/hand/egg.xml
      assetFileNamePen: mjcf/open_ai_assets/hand/pen.xml
  task:
    randomize: false
    randomization_params:
      frequency: 600
      observations:
        range:
        - 0
        - 0.002
        range_correlated:
        - 0
        - 0.001
        operation: additive
        distribution: gaussian
        schedule: linear
        schedule_steps: 40000
      actions:
        range:
        - 0.0
        - 0.05
        range_correlated:
        - 0
        - 0.015
        operation: additive
        distribution: gaussian
        schedule: linear
        schedule_steps: 40000
      sim_params:
        gravity:
          range:
          - 0
          - 0.4
          operation: additive
          distribution: gaussian
          schedule: linear
          schedule_steps: 40000
      actor_params:
        hand:
          color: true
          tendon_properties:
            damping:
              range:
              - 0.3
              - 3.0
              operation: scaling
              distribution: loguniform
              schedule: linear
              schedule_steps: 30000
            stiffness:
              range:
              - 0.75
              - 1.5
              operation: scaling
              distribution: loguniform
              schedule: linear
              schedule_steps: 30000
          dof_properties:
            damping:
              range:
              - 0.3
              - 3.0
              operation: scaling
              distribution: loguniform
              schedule: linear
              schedule_steps: 30000
            stiffness:
              range:
              - 0.75
              - 1.5
              operation: scaling
              distribution: loguniform
              schedule: linear
              schedule_steps: 30000
            lower:
              range:
              - 0
              - 0.01
              operation: additive
              distribution: gaussian
              schedule: linear
              schedule_steps: 30000
            upper:
              range:
              - 0
              - 0.01
              operation: additive
              distribution: gaussian
              schedule: linear
              schedule_steps: 30000
          rigid_body_properties:
            mass:
              range:
              - 0.5
              - 1.5
              operation: scaling
              distribution: uniform
              schedule: linear
              schedule_steps: 30000
          rigid_shape_properties:
            friction:
              num_buckets: 250
              range:
              - 0.7
              - 1.3
              operation: scaling
              distribution: uniform
              schedule: linear
              schedule_steps: 30000
        object:
          scale:
            range:
            - 0.95
            - 1.05
            operation: scaling
            distribution: uniform
            schedule: linear
            schedule_steps: 30000
          rigid_body_properties:
            mass:
              range:
              - 0.5
              - 1.5
              operation: scaling
              distribution: uniform
              schedule: linear
              schedule_steps: 30000
          rigid_shape_properties:
            friction:
              num_buckets: 250
              range:
              - 0.7
              - 1.3
              operation: scaling
              distribution: uniform
              schedule: linear
              schedule_steps: 30000
  sim:
    dt: 0.01667
    substeps: 2
    up_axis: z
    use_gpu_pipeline: ${eq:${...pipeline},"gpu"}
    gravity:
    - 0.0
    - 0.0
    - -9.81
    physx:
      num_threads: ${....num_threads}
      solver_type: ${....solver_type}
      use_gpu: ${contains:"cuda",${....sim_device}}
      num_position_iterations: 8
      num_velocity_iterations: 0
      max_gpu_contact_pairs: 8388608
      num_subscenes: ${....num_subscenes}
      contact_offset: 0.002
      rest_offset: 0.0
      bounce_threshold_velocity: 0.2
      max_depenetration_velocity: 1000.0
      default_buffer_size_multiplier: 5.0
      contact_collection: 0
train:
  params:
    algo:
      name: a2c_continuous
    model:
      name: continuous_a2c_logstd
    network:
      name: actor_critic
      separate: true
      space:
        continuous:
          mu_activation: None
          sigma_activation: None
          mu_init:
            name: default
            scale: 0.02
          sigma_init:
            name: const_initializer
            val: 0
          fixed_sigma: true
      mlp:
        units:
        - 512
        - 256
        - 128
        activation: elu
        initializer:
          name: default
        regularizer:
          name: None
    load_checkpoint: ${if:${...checkpoint},True,False}
    load_path: ${...checkpoint}
    config:
      name: ${resolve_default:ShadowHandDoorOpenInward,${....experiment}}
      full_experiment_name: ${.name}
      env_name: rlgpu
      multi_gpu: ${....multi_gpu}
      ppo: true
      mixed_precision: false
      normalize_input: false
      normalize_value: true
      value_bootstrap: true
      num_actors: ${....task.env.numEnvs}
      reward_shaper:
        scale_value: 0.01
      normalize_advantage: true
      gamma: 0.96
      tau: 0.95
      learning_rate: 0.0003
      lr_schedule: adaptive
      schedule_type: standard
      kl_threshold: 0.016
      score_to_win: 100000
      max_epochs: ${resolve_default:6000,${....max_iterations}}
      save_best_after: 100
      save_frequency: 200
      print_stats: true
      grad_norm: 1.0
      entropy_coef: 0.0
      truncate_grads: true
      e_clip: 0.2
      horizon_length: 8
      minibatch_size: 16384
      mini_epochs: 5
      critic_coef: 1
      clip_value: true
      seq_len: 4
      bounds_loss_coef: 0.001
      player:
        deterministic: true
        games_num: 2000
        print_stats: true
