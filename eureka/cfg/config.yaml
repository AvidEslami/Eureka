defaults:
  - _self_
  - env: shadow_hand_scissors
  - override hydra/launcher: local
  - override hydra/output: local

hydra:
  job:
    chdir: True

# LLM parameters
model: gemini-2.5-pro  # LLM model (or Gemini model id like gemini-2.0-flash-001)
llm_provider: gemini  # openai or gemini
api_key: ""  # optional; if empty, falls back to env (OPENAI_API_KEY or GOOGLE_API_KEY)
temperature: 1.0
suffix: GPT  # suffix for generated files (indicates LLM model)
thinking_budget: -1  # Optional: 0=off, -1=dynamic, N=specific budget tokens

# Eureka parameters
iteration: 2 # how many iterations of Eureka to run
sample: 3 # number of Eureka samples to generate per iteration
max_iterations: 8000 # RL Policy training iterations (decrease this to make the feedback loop faster)
num_eval: 1 # number of evaluation episodes to run for the final reward
capture_video: False # whether to capture policy rollout videos

# Weights and Biases
use_wandb: False # whether to use wandb for logging
wandb_username: "" # wandb username if logging with wandb
wandb_project: "" # wandb project if logging with wandb
